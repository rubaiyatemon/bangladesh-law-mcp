# Fly.io configuration for the Bangladesh Law MCP server.
#
# Free tier gives 3 shared-cpu-1x 256MB VMs. With
# `auto_stop_machines = false` they stay always-on (so the MCP
# endpoint is reachable 24/7) and Fly won't bill you until you
# exceed the free allowance.
#
# The MCP endpoint is served at /mcp, and /healthz is exposed for
# platform liveness checks.

app = "bangladesh-law-mcp"
primary_region = "sin"  # Singapore — closest free region to South Asia

[build]
  dockerfile = "Dockerfile"

[env]
  TRANSPORT = "http"
  HOST = "0.0.0.0"
  PORT = "8000"
  BLA_LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false       # keep the VM awake 24/7 on free tier
  auto_start_machines = true
  min_machines_running = 1         # always run at least one VM
  processes = ["app"]

  # The MCP Streamable HTTP endpoint.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

# Optional: scale rules (left commented — keep free-tier footprint).
# [[metrics]]
#   port = 8000
#   path = "/healthz"
